group 'io.nearpay.flutter.plugin'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.2.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Bumped from 33: androidx deps of nearpay-sdk-store require compileSdk >= 34
    // (enforced by AGP checkReleaseAarMetadata on release builds).
    compileSdkVersion 34
    namespace("io.nearpay.flutter.plugin")

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 21
    }

    dependencies {
        implementation 'io.nearpay:nearpay-sdk-store:2.1.95'
        implementation 'com.google.code.gson:gson:2.9.0'
    }
}
